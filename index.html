<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>菠萝农场巨大化计算器</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f8f7f2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
                   sans-serif;
      color: #333333;
    }

    .container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 70px 24px 30px;
    }

    .title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 50px;
    }

    .label {
      font-size: 15px;
      color: #777777;
      margin-bottom: 12px;
    }

    .input {
      width: 100%;
      max-width: 360px;
      height: 54px;
      border: 1px solid #dddddd;
      border-radius: 14px;
      background: #ffffff;
      padding: 0 18px;
      font-size: 20px;
      text-align: center;
      outline: none;
    }

    .input:focus {
      border-color: #aaaaaa;
    }

    .result {
      margin-top: 55px;
      text-align: center;
    }

    .result-label {
      font-size: 15px;
      color: #777777;
      margin-bottom: 10px;
    }

    .result-number {
      font-size: 48px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .creator {
      margin-top: auto;
      padding-top: 60px;
      font-size: 12px;
      color: #aaaaaa;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="title">
      菠萝农场巨大化计算器
    </div>

    <div class="label">
      输入当前水果体重
    </div>

    <input
      id="input"
      class="input"
      type="number"
      inputmode="decimal"
      placeholder="请输入数字"
    >

    <div id="result" class="result" style="display: none;">
      <div class="result-label">
        目标倍数
      </div>

      <div id="resultNumber" class="result-number">
        0.00 倍
      </div>
    </div>

    <div class="creator">
      创作者：一蓑烟雨悬疑
    </div>

  </div>

  <script>
    const input = document.getElementById("input");
    const result = document.getElementById("result");
    const resultNumber = document.getElementById("resultNumber");

    input.addEventListener("input", function () {
      const value = input.value;
      const num = Number(value);

      if (!value || num <= 0 || isNaN(num)) {
        result.style.display = "none";
        return;
      }

      const calculated = (5 / num).toFixed(2);

      resultNumber.textContent = calculated + " 倍";
      result.style.display = "block";
    });
  </script>

</body>
</html>
